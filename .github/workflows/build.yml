name: Build

on:
  push:
    branches: [main, port/fabric-26.3]
  pull_request:
    branches: [main, port/fabric-26.3]

jobs:
  build:
    name: Build (JDK 25)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-readonly: false

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --console=plain
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2G -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ennuis-bigger-inventories-${{ github.sha }}
          path: build/libs/*.jar
          retention-days: 7