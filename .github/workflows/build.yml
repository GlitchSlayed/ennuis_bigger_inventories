name: Build

on:
  push:
    branches: [main, port/fabric-26.3]
  pull_request:
    branches: [main, port/fabric-26.3]
  release:
    types: [published]

jobs:
  build:
    name: Build (JDK 25)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-readonly: false

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --console=plain
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2G -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ennuis-bigger-inventories-${{ github.ref_name }}-${{ github.sha::7 }}
          path: build/libs/*.jar
          retention-days: 7

      - name: Publish to GitHub Packages
        if: github.event_name == 'release' && github.event.action == 'published'
        run: ./gradlew publish --no-daemon --console=plain
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2G"
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}

      - name: Create Release Asset
        if: github.event_name == 'release' && github.event.action == 'published'
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}